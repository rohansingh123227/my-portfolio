<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apex Racers - Mobile Edition</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151a23;
      --accent-neon: #00ffaa;
      --accent-red: #ff3366;
      --accent-blue: #00d9ff;
      --text: #e0e6ed;
      --text-muted: #6272a4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      padding: 10px;
    }

    /* Top HUD Header */
    header {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent-neon), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-neon);
    }

    /* Game Viewport */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background: #111;
      border-radius: 12px;
      width: 100%;
      height: 100%;
      max-height: 400px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    /* Mobile Controls Overlay */
    .controls-container {
      width: 100%;
      max-width: 450px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 10px 0;
      margin-top: 5px;
    }

    .steering-group, .pedal-group {
      display: flex;
      gap: 10px;
    }

    .control-btn {
      flex: 1;
      height: 65px;
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.1s;
    }

    .control-btn:active, .control-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--accent-neon);
    }

    .btn-accel {
      background: rgba(0, 255, 170, 0.15);
      border-color: var(--accent-neon);
      color: var(--accent-neon);
    }

    .btn-brake {
      background: rgba(255, 51, 102, 0.15);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* AI Prompt Bar */
    .prompt-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }

    input[type="text"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.8rem;
      outline: none;
    }

    .btn-small {
      background: var(--accent-blue);
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    /* Overlay Screens */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 20, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      z-index: 10;
    }

    .overlay-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-neon);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>APEX MOBILE</h1>
    <div style="font-size: 0.75rem; color: var(--accent-neon);">● TOUCH READY</div>
  </header>

  <!-- HUD Bar -->
  <div class="hud-bar">
    <div class="hud-item">
      <span class="hud-label">Speed</span>
      <span class="hud-value" id="hud-speed">0 <small style="font-size: 0.6rem">KM/H</small></span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Pos</span>
      <span class="hud-value" id="hud-pos">1/4</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Lap</span>
      <span class="hud-value" id="hud-lap">1/3</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Time</span>
      <span class="hud-value" id="hud-time">00:00</span>
    </div>
  </div>

  <!-- Game Canvas -->
  <div class="game-container">
    <div id="game-overlay" class="overlay">
      <div class="overlay-title">APEX RACERS</div>
      <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 0.9rem;">Touch to start race</p>
      <button class="btn-small" style="padding: 12px 24px; font-size: 1rem;" onclick="startGame()">START RACE</button>
    </div>
    <canvas id="raceCanvas"></canvas>
  </div>

  <!-- AI Tuning Prompt Bar -->
  <div class="prompt-bar">
    <input type="text" id="aiPrompt" placeholder="e.g. rain, fast ai, 5 laps..." />
    <button class="btn-small" onclick="applyPrompt()">Tune AI</button>
  </div>

  <!-- Touch Controls -->
  <div class="controls-container">
    <div class="steering-group">
      <div class="control-btn" id="btn-left">◀</div>
      <div class="control-btn" id="btn-right">▶</div>
    </div>
    <div class="pedal-group">
      <div class="control-btn btn-brake" id="btn-brake">brake</div>
      <div class="control-btn btn-accel" id="btn-accel">GAS</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');

    // Auto-resizing for mobile screen
    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Mobile Input State
    let controls = { left: false, right: false, accel: false, brake: false };

    function bindTouch(id, key) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); controls[key] = true; el.classList.add('active'); triggerHaptic(); };
      const end = (e) => { e.preventDefault(); controls[key] = false; el.classList.remove('active'); };
      
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-accel', 'accel');
    bindTouch('btn-brake', 'brake');

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(10);
    }

    // Config
    let config = {
      lapsTotal: 3,
      aiAggro: 0.6,
      weather: 'clear',
      playerTopSpeed: 6.5,
      friction: 0.98,
      handling: 0.05
    };

    // Track Points (Scaled for mobile vertical space)
    const trackPoints = [
      {x: 60, y: 80}, {x: 200, y: 60}, {x: 300, y: 120},
      {x: 280, y: 260}, {x: 180, y: 320}, {x: 80, y: 250}
    ];

    let player = { x: 60, y: 80, angle: 0, speed: 0, lap: 1, checkpoint: 0, color: '#00ffaa' };
    let aiBots = [
      { x: 50, y: 100, angle: 0, speed: 0, color: '#ff3366', targetIndex: 1, lap: 1, checkpoint: 0 },
      { x: 70, y: 60, angle: 0, speed: 0, color: '#00d9ff', targetIndex: 1, lap: 1, checkpoint: 0 }
    ];

    let gameState = 'STOPPED';
    let startTime = 0;

    function startGame() {
      document.getElementById('game-overlay').style.display = 'none';
      gameState = 'RUNNING';
      startTime = Date.now();
      resetPositions();
      requestAnimationFrame(gameLoop);
    }

    function resetPositions() {
      player.x = trackPoints[0].x;
      player.y = trackPoints[0].y;
      player.angle = Math.PI / 2;
      player.speed = 0;
      player.lap = 1;
      player.checkpoint = 0;
    }

    function applyPrompt() {
      const prompt = document.getElementById('aiPrompt').value.toLowerCase();
      if (prompt.includes('rain')) config.weather = 'rain';
      if (prompt.includes('fast')) config.playerTopSpeed = 9;
      if (prompt.includes('hard')) config.aiAggro = 1.0;
      const match = prompt.match(/(\d+)\s*lap/);
      if (match) config.lapsTotal = parseInt(match[1]);
      alert('AI Configuration Tuned!');
    }

    function update() {
      if (gameState !== 'RUNNING') return;

      // Steering
      if (controls.left) player.angle -= config.handling;
      if (controls.right) player.angle += config.handling;

      // Pedals
      if (controls.accel) {
        player.speed = Math.min(player.speed + 0.15, config.playerTopSpeed);
      } else if (controls.brake) {
        player.speed = Math.max(player.speed - 0.15, -config.playerTopSpeed / 2);
      } else {
        player.speed *= config.friction;
      }

      // Movement
      player.x += Math.cos(player.angle) * player.speed;
      player.y += Math.sin(player.angle) * player.speed;

      // AI Logic
      aiBots.forEach(bot => {
        let target = trackPoints[bot.targetIndex];
        let dx = target.x - bot.x;
        let dy = target.y - bot.y;
        let targetAngle = Math.atan2(dy, dx);

        let angleDiff = Math.atan2(Math.sin(targetAngle - bot.angle), Math.cos(targetAngle - bot.angle));
        bot.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), 0.04 * config.aiAggro);

        bot.speed = config.playerTopSpeed * 0.85;
        bot.x += Math.cos(bot.angle) * bot.speed;
        bot.y += Math.sin(bot.angle) * bot.speed;

        if (Math.hypot(dx, dy) < 30) {
          bot.targetIndex = (bot.targetIndex + 1) % trackPoints.length;
        }
      });

      // Laps
      let nextCp = (player.checkpoint + 1) % trackPoints.length;
      let targetCp = trackPoints[nextCp];
      if (Math.hypot(targetCp.x - player.x, targetCp.y - player.y) < 40) {
        player.checkpoint = nextCp;
        if (nextCp === 0) player.lap++;
      }

      // Update HUD
      document.getElementById('hud-speed').innerText = Math.round(Math.abs(player.speed) * 20);
      document.getElementById('hud-lap').innerText = `${Math.min(player.lap, config.lapsTotal)}/${config.lapsTotal}`;

      let elapsed = (Date.now() - startTime) / 1000;
      document.getElementById('hud-time').innerText = elapsed.toFixed(1) + 's';
    }

    function render() {
      ctx.fillStyle = config.weather === 'night' ? '#05070a' : '#151a23';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Scaling factor based on canvas size
      const scaleX = canvas.width / 360;
      const scaleY = canvas.height / 360;

      ctx.save();
      ctx.scale(scaleX, scaleY);

      // Track Road
      ctx.beginPath();
      ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
      for (let i = 1; i < trackPoints.length; i++) ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
      ctx.closePath();
      ctx.lineWidth = 40;
      ctx.strokeStyle = '#2b3240';
      ctx.stroke();

      // Render Cars
      aiBots.forEach(bot => drawCar(bot.x, bot.y, bot.angle, bot.color));
      drawCar(player.x, player.y, player.angle, player.color);

      ctx.restore();
    }

    function drawCar(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-8, -5, 16, 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(6, -4, 2, 2);
      ctx.fillRect(6, 2, 2, 2);
      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      if (gameState === 'RUNNING') requestAnimationFrame(gameLoop);
    }

    render();
  </script>
</body>
</html>
